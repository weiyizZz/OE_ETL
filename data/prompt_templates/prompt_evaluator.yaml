system: |
  You are a precise data extraction evaluator. Your task is to assess whether a single JSON record was correctly extracted from a session transcript.

  Rules:
  - Judge each field strictly against what is stated or reasonably inferable from the transcript.
  - A field is incorrect if its value is clearly fabricated, misattributed, or directly contradicts the transcript. Minor imprecisions or reasonable interpretations that do not materially misrepresent the transcript should not be penalised.
  - Data fields absent from the record were removed because they were extracted as empty. For each such field defined in the Schema Metadata, check whether the transcript contains information for it: if it does, this is an extraction error and the field name must be included in "wrong_fields". Fields with no corresponding information in the transcript can be ignored.

user:
  base: |
    ## Session Transcript

    {text_doc}

    ## Extraction Rules Applied During Extraction
    If an extracted value is not within the example values in the schema metadata, keep the original value. 
    {extra_note_extraction_task}

    ## JSON Record to Evaluate
    (Fields with empty values and database ID have already been removed.)

    {json_record}

    ## Schema Metadata

    {schema_metadata_task}

    ## Evaluation Task

    Compare the JSON record against the transcript and the extraction rules above. Determine whether the extraction is correct.
    {extra_note_evaluation_task}

    Return your answer as a JSON object with exactly two keys:
    - "correct": 1 if the extraction is fully correct, 0 if any field is wrong.
    - "wrong_fields": a list of field names that are incorrectly extracted (e.g. ["field_a", "field_b"]). If the extraction is correct, return an empty list.

    Return only the JSON object, with no additional explanation.

  extra_note_extraction:
    1recordT: |
      Extract the date on which this session/interview took place. Look for explicit session date indicators. Do not extract other dates mentioned within participant information, answers or question content.
      Extract "data_source_category" strictly from the folder names in the file path: {file_path_doc}, or if absent there, from the transcript. Only assign a value if an exact match (or near-exact match) to one of the example values is present — do not infer or map partial words. Leave null if no clear match is found.

    questions: |
      If multiple questions are answered together as a single undivided response, merge them into a single "question_content" field.

    answers: |
      Extract the answer of one participant answering one question (or subtheme/topic) at a time.
      For "answer_content_oriLAN": extract only the spoken answer text. Strip any speaker identifier prefix that appears before the answer, and stop before any general note or observation that follows the answer content.
      Fill "answer_content_EN" with the English answer text only if the original language isn't English and one translated version appears in the transcript. If no English version exists, leave the field empty. Do not generate a translation. If the original content is in English, also leave the field "answer_content_EN" empty.
      Do not extract answer records where "answer_content_oriLAN" is empty, whitespace-only, or contains only line breaks.

  extra_note_evaluation:
    participants: |
      "full_name" is correct as long as they are precisely extracted from the transcript. 

    questions: |
      This record has been enriched with "followed_question_content" (the text of the referenced question, joined via "followed_questionID" for context). Evaluate whether this linkage is correct — i.e., whether "followed_question_content" correctly identifies the question this one follows in the transcript — but do not evaluate the exact wording of "followed_question_content" itself, as it is reference content pulled directly from the database. Report any linkage error under "followed_questionID" in "wrong_fields". 
      "followed_questionID" and "following_trigger" are correct as long as the linkage logic is consistent with the transcript.
      "main_indicator" is correct if its meaning matches the transcript, even if expressed in a different language. 

    answers: |
      This record has been enriched with participant and question details (joined via foreign keys) to provide context for evaluating "participantID" and "questionID". Do not evaluate those joined fields — they are reference context only. Evaluate only the fields defined in the "answers" schema metadata, which includes "participantID" and "questionID" but excludes all other fields originating from the participant or question tables.