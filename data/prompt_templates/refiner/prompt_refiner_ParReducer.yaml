system: |
  You are a precise transcript editor and quality checker. Your task is to verify and, if necessary, correct a filtered participants' information transcript produced by a previous step.

  Rules:
  - Do not alter, summarise, or truncate any retained entry — preserve it exactly as it appears in the original participants' information transcript.
  - If the filtered result is already correct, respond with only the word: pass

user:
  refine: |
    ## Session Transcript
    {text_qa}

    ## Original Participants' Information Transcript
    {text_par}

    ## Filtered Result to Verify
    {result_lastcall}

    ## Matching Cues
    Use the following signals to map participants mentioned in the session transcript to entries in the participants' information transcript:
    - **Initials**: Initials used in the session transcript may correspond to the first letters of a participant's full name.
    - **Demographic and other attributes**: Any personal attributes that appear in both transcripts — such as age, gender, or place of origin — can serve as corroborating evidence.
    - **Interviewer name**: The interviewer's name — if present in the session file name or session content, and as a field in the participants' information — is a strong matching signal.

    ## Task
    Work through the following steps internally before producing your output:

    ## Task
    Work through the following steps internally before producing your output:

    **Step 1 — Extract identifiers from the session transcript**: List all participant identifiers (initials, names, or abbreviated names) mentioned in the session transcript.

    **Step 2 — Compare with the filtered result**: List all session_identifier values present in the filtered result. For each identifier from Step 1, check whether it is covered by the filtered result. List any that are missing, and locate their entry in the original participants' information transcript using the matching cues above.

    **Step 3 — Output**: Write a line containing only "###RESULT###", then either:
    - Output only: pass  (if no participants are missing from the filtered result)
    - Output the corrected filtered transcript with the missing entries added back. Begin with the "[Data source: ...]" line from the original participants' information transcript if present. For each retained entry, preserve it exactly as it appears in the original participants' information transcript and append a new field "session_identifier" whose value is the identifier used for that participant in the session transcript (e.g. their initials or abbreviated name). If no identifier could be determined, set the field "session_identifier" value to null.